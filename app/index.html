<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>VCC dev visualization — GGThreshold (model units, unvalidated)</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #0c0f14;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      #scene {
        position: fixed;
        inset: 0;
      }
      /* Tweakpane's default dock; widened so §1.5 provenance labels stay readable. */
      .tp-dfwv {
        width: 380px;
      }
      /* All info panels live in ONE left-edge flex column: they stack top-to-bottom, never
         overlap each other, and never occlude the screen center — where the crystal and its
         depletion well sit. Hidden panels release their space automatically. */
      #left-column {
        position: fixed;
        left: 8px;
        top: 8px;
        bottom: 8px;
        width: 348px;
        display: flex;
        flex-direction: column;
        justify-content: flex-end;
        gap: 6px;
        z-index: 10;
        pointer-events: none;
        overflow: hidden;
      }
      /* The hover readout is transient and lives at the fixed top-left, outside the column,
         so the bottom-anchored column can never push it off-screen. */
      #readout {
        position: fixed;
        top: 8px;
        left: 8px;
        max-width: 520px;
        z-index: 11;
      }
      .panel {
        padding: 6px 10px;
        color: #c9d4e3;
        background: rgba(12, 15, 20, 0.82);
        border: 1px solid #2a3342;
        border-radius: 4px;
        font-size: 12px;
        line-height: 1.5;
        white-space: pre-wrap;
      }
      #legends {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      #legends[hidden] {
        display: none;
      }
      #hud canvas {
        display: block;
        margin-top: 4px;
        border: 1px solid #2a3342;
        max-width: 100%;
      }
      .legend {
        padding: 6px 10px;
        color: #c9d4e3;
        background: rgba(12, 15, 20, 0.82);
        border: 1px solid #2a3342;
        border-radius: 4px;
        font-size: 11px;
        line-height: 1.4;
        max-width: 340px;
        white-space: pre-wrap;
      }
      .legend canvas {
        display: block;
        width: 100%;
        height: 10px;
        margin: 4px 0 2px;
        border: 1px solid #2a3342;
      }
      .legend .range {
        display: flex;
        justify-content: space-between;
      }
    </style>
  </head>
  <body>
    <div id="scene"></div>
    <div id="readout" class="panel" hidden></div>
    <div id="left-column">
      <div id="legends">
        <div class="legend" id="legend-overlay" hidden>
          <div class="title"></div>
          <canvas width="256" height="10"></canvas>
          <div class="range"><span class="lo"></span><span class="hi"></span></div>
        </div>
        <div class="legend" id="legend-slice" hidden>
          <div class="title"></div>
          <canvas width="256" height="10"></canvas>
          <div class="range"><span class="lo"></span><span class="hi"></span></div>
        </div>
      </div>
      <div id="hud" class="panel" hidden>
        <div id="hud-text"></div>
        <canvas id="hud-canvas" width="300" height="70"></canvas>
      </div>
      <div id="status" class="panel">initializing…</div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
